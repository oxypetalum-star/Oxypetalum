<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oxypetalum</title>

  <style>

    body {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

      background-color: #fafcff;

      color: #30384a;

      line-height: 1.9;
    }


    /* 上のメニュー */

    header {
      padding: 25px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
    }

    header a {
      color: #30384a;
      text-decoration: none;
      margin: 0 12px;
    }


    /* サイト全体 */

    main {
      width: 90%;
      max-width: 650px;
      margin: auto;
    }


    /* タイトル */

    .title {
      text-align: center;
      padding: 80px 0 60px;
    }

    .title h1 {
      font-size: 30px;
      letter-spacing: 8px;
      font-weight: normal;
    }

    .title p {
      font-size: 12px;
      color: #7c8495;
    }


    /* 星の区切り */

    .stars {
      text-align: center;
      margin: 50px 0;
      color: #8296bd;
      letter-spacing: 10px;
    }


    /* コンテンツ */

    section {
      margin-bottom: 70px;
    }

    h2 {
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 3px;
      border-bottom: 1px solid #d9deea;
      padding-bottom: 10px;
    }


    /* 小説リンク */

    .novel {
      display: block;

      padding: 18px;
      margin: 15px 0;

      background: white;

      border: 1px solid #e1e5ee;

      text-decoration: none;
      color: #30384a;

      transition: 0.3s;
    }

    .novel:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(90, 110, 160, 0.1);
    }


    footer {
      text-align: center;
      padding: 80px 0 40px;
      font-size: 11px;
      color: #9299a8;
    }

  </style>

</head>


<body>


<header>

  <a href="#about">ABOUT</a>

  <a href="#novel">NOVEL</a>

  <a href="#memo">MEMO</a>

</header>


<main>


<div class="title">

  <div>✦</div>

  <h1>Oxypetalum</h1>

  <p>星と物語を置いておく、小さな書庫。</p>

</div>


<div class="stars">
  ⋆　✦　⋆
</div>


<section id="about">

<h2>✦ ABOUT</h2>

<p>
ここはFate/Grand Orderの非公式二次創作サイトです。
原作および公式各社とは一切関係ありません。
</p>

<p>
小説や設定、その他の記録を置いています。
</p>

</section>


<section id="novel">

<h2>✦ NOVEL</h2>

<a class="novel" href="#">
第一話　星のはじまり
</a>

<a class="novel" href="#">
第二話　星を結ぶもの
</a>

<a class="novel" href="#">
第三話
</a>

</section>


<div class="stars">
  ⋆｡˚ ✦ ˚｡⋆
</div>


<section id="memo">

<h2>✦ MEMO</h2>

<p>
人物設定、世界観、こぼれ話など。
</p>

</section>


</main>


<footer>

✦ Oxypetalum ✦

<br><br>

Unofficial Fan Site

</footer>


</body>
</html>
