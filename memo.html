<!DOCTYPE html>
<html lang="ja">

<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEMO | Oxypetalum</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      background: #07152f;
      color: #f5f2e9;
      line-height: 2;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(5, 15, 35, 0.35);
      backdrop-filter: blur(8px);
    }

    .site-name {
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back-link {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.8;
      transition: 0.3s;
    }

    .back-link:hover {
      opacity: 1;
      color: #e1c47b;
    }

    main {
      min-height: 100vh;
      padding: 140px 8% 100px;
      background: #0b1730;
    }

    .content {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 60px;
    }

    .section-title span {
      display: block;
      color: #d8b96a;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .section-title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 6px;
    }

    .section-title::after {
      content: "";
      display: block;
      width: 45px;
      height: 1px;
      margin: 25px auto 0;
      background: #d8b96a;
    }

    .memo-box {
      padding: 35px;
      border-left: 1px solid #d8b96a;
      background: rgba(255,255,255,0.03);
    }

    .memo-box p {
      margin: 0 0 28px;
    }

    .memo-box p:last-child {
      margin-bottom: 0;
    }

    footer {
      padding: 60px 20px;
      text-align: center;
      background: #060e20;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.65);
    }

    .footer-star {
      color: #d8b96a;
      font-size: 20px;
      margin-bottom: 15px;
    }

    @media (max-width: 700px) {
      header {
        padding: 18px 22px;
      }

      main {
        padding: 120px 7% 80px;
      }

      .memo-box {
        padding: 28px 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="site-name" href="index.html">Oxypetalum</a>
  <a class="back-link" href="index.html#memo">← TOP</a>
</header>

<main>
  <div class="content">
    <div class="section-title">
      <span>✦</span>
      <h1>MEMO</h1>
    </div>

    <div class="memo-box">
      <p>
        2026.08.14<br>
        第三話「星を見つめる」更新
      </p>

      <p>
        2026.08.13<br>
        第二話「星を結ぶもの」更新
      </p>

      <p>
        2026.08.13<br>
        『星をみつけるおはなし』マリスビリー×魔眼持ち新入生 連載開始
      </p>

      <p>
        2026.08.13<br>
        サイトを開設しました。
      </p>
    </div>
  </div>
</main>

<footer>
  <div class="footer-star">✦</div>
  <p>Oxypetalum</p>
  <p>Unofficial Fan Site</p>
</footer>

</body>
</html>
