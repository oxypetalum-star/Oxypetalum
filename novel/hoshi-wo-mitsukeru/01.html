<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive, nosnippet"
  >

  <title>星に出逢う日 | Oxypetalum</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;

      color: #f5f2e9;
      line-height: 2.2;

      background:
        linear-gradient(
          rgba(5, 15, 35, 0.92),
          rgba(5, 15, 35, 0.98)
        ),
        url("../../star-bg.PNG");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      padding: 20px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 100;

      background: rgba(5, 15, 35, 0.6);

      backdrop-filter: blur(8px);
    }

    .site-name {
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back-link {
      font-size: 12px;
      letter-spacing: 2px;

      opacity: 0.8;
    }

    main {
      min-height: 100vh;

      padding:
        150px 7%
        100px;
    }

    .content {
      width: 100%;
      max-width: 680px;

      margin: 0 auto;
    }

    .episode-header {
      text-align: center;
      margin-bottom: 70px;
    }

    .episode-series {
      margin-bottom: 12px;

      font-size: 11px;
      letter-spacing: 2px;

      color: #d8b96a;
    }

    h1 {
      margin: 0;

      font-size: 27px;
      font-weight: normal;

      letter-spacing: 4px;
    }

    .episode-header::after {
      content: "";

      display: block;

      width: 50px;
      height: 1px;

      margin: 28px auto;

      background: #d8b96a;
    }

    .novel-text {
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .novel-text p {
      margin:
        0
        0
        2em;
    }

    .scene-break {
      margin:
        55px
        0;

      text-align: center;

      color: #d8b96a;

      letter-spacing: 8px;
    }

    .navigation {
      margin-top: 90px;

      padding-top: 35px;

      border-top:
        1px solid
        rgba(
          216,
          185,
          106,
          0.35
        );

      display: flex;
      justify-content: space-between;

      gap: 20px;
    }
.navigation span {
  font-size: 11px;
  letter-spacing: 2px;

  color:
    rgba(
      255,
      255,
      255,
      0.45
    );
}
    .navigation a {
      font-size: 11px;
      letter-spacing: 2px;

      color:
        rgba(
          255,
          255,
          255,
          0.7
        );
    }

    footer {
      padding: 40px 20px;

      text-align: center;

      background:
        rgba(
          3,
          10,
          25,
          0.8
        );

      font-size: 10px;
      letter-spacing: 2px;

      color:
        rgba(
          255,
          255,
          255,
          0.5
        );
    }

    @media (max-width: 700px) {

      header {
        padding:
          18px
          22px;
      }

      main {
        padding:
          130px
          7%
          80px;
      }

      h1 {
        font-size: 23px;
      }

      .novel-text {
        font-size: 14px;
      }

      .navigation {
        flex-direction: column;
        align-items: center;
      }

    }

  </style>
</head>

  <div class="navigation">

<footer>

</html>
