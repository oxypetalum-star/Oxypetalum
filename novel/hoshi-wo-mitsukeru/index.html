<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive, nosnippet"
  >

  <title>星をみつけるおはなし | Oxypetalum</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;

      color: #f5f2e9;
      line-height: 2;

      background:
        linear-gradient(
          rgba(5, 15, 35, 0.90),
          rgba(5, 15, 35, 0.97)
        ),
        url("../../star-bg.PNG");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      padding: 20px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 100;

      background: rgba(5, 15, 35, 0.6);

      backdrop-filter: blur(8px);
    }

    .site-name {
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back-link {
      font-size: 12px;
      letter-spacing: 2px;

      opacity: 0.8;
    }

    main {
      min-height: 100vh;

      padding:
        150px 7%
        100px;
    }

    .content {
      width: 100%;
      max-width: 720px;

      margin: 0 auto;
    }

    .work-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .symbol {
      color: #d8b96a;
      font-size: 20px;

      margin-bottom: 12px;
    }

    h1 {
      margin: 0;

      font-size: 28px;
      font-weight: normal;

      letter-spacing: 4px;
    }

    .work-header::after {
      content: "";

      display: block;

      width: 50px;
      height: 1px;

      margin: 28px auto;

      background: #d8b96a;
    }

    .work-meta {
      margin: 0;

      font-size: 12px;
      letter-spacing: 1.5px;

      color:
        rgba(
          255,
          255,
          255,
          0.65
        );
    }

    .notice {
      margin-bottom: 40px;

      padding: 20px 22px;

      border-left:
        1px solid
        rgba(216, 185, 106, 0.65);

      background:
        rgba(255, 255, 255, 0.03);

      font-size: 12px;

      color:
        rgba(
          255,
          255,
          0.72
        );
    }

    .summary {
      margin-bottom: 60px;

      font-size: 14px;
    }

    .episode-list {
      display: grid;
      gap: 18px;
    }

    .episode {
      display: flex;
      gap: 20px;

      align-items: center;

      padding: 20px 22px;

      border-left:
        1px solid
        rgba(216, 185, 106, 0.7);

      background:
        rgba(255, 255, 255, 0.035);

      transition:
        transform 0.3s,
        background 0.3s;
    }

    .episode:hover {
      transform: translateY(-3px);

      background:
        rgba(255, 255, 255, 0.065);
    }

    .episode-number {
      color: #d8b96a;

      font-size: 11px;
      letter-spacing: 2px;
    }

    .episode-title {
      font-size: 16px;
      letter-spacing: 2px;
    }

    .bottom-link {
      margin-top: 70px;
      text-align: center;
    }

    .bottom-link a {
      font-size: 11px;
      letter-spacing: 2px;

      color:
        rgba(
          255,
          255,
          255,
          0.7
        );
    }

    footer {
      padding: 40px 20px;

      text-align: center;

      background:
        rgba(
          3,
          10,
          25,
          0.8
        );

      font-size: 10px;
      letter-spacing: 2px;

      color:
        rgba(
          255,
          255,
          255,
          0.5
        );
    }

    @media (max-width: 700px) {

      header {
        padding:
          18px
          22px;
      }

      main {
        padding:
          130px
          7%
          80px;
      }

      h1 {
        font-size: 23px;
      }

      .episode {
        padding:
          18px
          18px;
      }

    }

  </style>
</head>


<body>


<header>

  <a
    class="site-name"
    href="../../index.html"
  >
    Oxypetalum
  </a>

  <a
    class="back-link"
    href="../../long.html"
  >
    ← LONG
  </a>

</header>


<main>

  <div class="content">


    <div class="work-header">

      <div class="symbol">
        ✦
      </div>

      <h1>
        星をみつけるおはなし
      </h1>

      <p class="work-meta">
        Fate/Grand Order / 長編 / 連載中
      </p>

    </div>


  <div class="notice">

  独自解釈・捏造設定・オリジナル主人公を含みます。<br>
  原作のネタバレを含む場合があります。

</div>


<div class="summary">

  <p>
    少女のはなしをするとしよう。
  </p>

  <p>
    人がなぜ星を見上げるのか、その理由を知りたがった少女のはなしを。
  </p>

  <p>
    星を追う魔術師。<br>
    星へ問う魔術師。<br>
    星に眩む魔術師。
  </p>

  <p>
    君のことを知らない私が、<br>
    君のハッピーエンドを願う少女のはなしを。
  </p>

</div>

<div class="episode-list">

  <a href="01.html" class="episode">
    <span class="episode-number">01</span>
    <span class="episode-title">星に出逢う日</span>
  </a>

  <a href="02.html" class="episode">
    <span class="episode-number">02</span>
    <span class="episode-title">星を結ぶもの</span>
  </a>

  <a href="03.html" class="episode">
    <span class="episode-number">03</span>
    <span class="episode-title">星をみつめる</span>
  </a>

</div>

</main>


<footer>

  Oxypetalum
  ·
  Written by 二重アゴ

</footer>

</body>

</html>
